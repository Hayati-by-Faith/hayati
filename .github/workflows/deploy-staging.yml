name: Deploy staging

on:
  push:
    branches:
      - main

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      - name: Run rules tests
        run: |
          cd rules-tests
          npm ci
          npm test

  deploy:
    runs-on: ubuntu-latest
    needs: rules-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Authenticate with Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to staging
        run: firebase deploy --only firestore:rules,firestore:indexes,functions -P staging
