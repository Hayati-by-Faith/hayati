name: hayati
description: Hayati Flutter scaffold for El Haya Foundation.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.3
  firebase_remote_config: ^6.3.0
  firebase_app_check: ^0.4.2
  firebase_crashlytics: ^5.1.0
  firebase_performance: ^0.11.2
  firebase_analytics: ^12.2.0
  cloud_functions: ^6.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  device_info_plus: ^12.4.0
  share_plus: ^12.0.2
  cached_network_image: ^3.4.1
  cross_file: ^0.3.5+2
  image_picker: ^1.2.1
  photo_view: ^0.15.0
  path_provider: ^2.1.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  flutter_markdown: ^0.7.7+1
  audioplayers: ^6.6.0
  dart_geohash: ^2.1.0
  google_mlkit_face_detection: ^0.13.2
  video_player: ^2.11.1
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
